<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Endless Runner</title>
  <style>
    /* The canvas fills the whole window. render.js sizes it and scales the
       fixed-size game world to fit, so the game plays the same at any size. */
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #fff; }
    canvas { display: block; touch-action: none; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Plain scripts (not ES modules) so the game works when you double-click
       index.html. Modules are blocked on file:// URLs by the browser.
       ORDER MATTERS: each file uses globals defined by the ones above it. -->
  <script src="game.js"></script>
  <script src="input.js"></script>
  <script src="sound.js"></script>
  <script src="render.js"></script>
  <script src="main.js"></script>
</body>
</html>
